<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>REBECCA_CORE :: Terminal de Operaciones</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --panel: #10161f;
    --panel-border: #1d2733;
    --cyan: #4ce0d2;
    --magenta: #ff3d81;
    --amber: #ffb238;
    --text: #d8e4e8;
    --text-dim: #5b6b74;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(76, 224, 210, 0.015) 0px,
      rgba(76, 224, 210, 0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 100;
  }

  header {
    border-bottom: 1px solid var(--panel-border);
    padding: 18px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, #0d1219 0%, var(--bg) 100%);
  }

  .brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: 1px;
  }
  .brand .cursor {
    display: inline-block;
    width: 9px; height: 18px;
    background: var(--cyan);
    margin-left: 6px;
    animation: blink 1.1s steps(1) infinite;
    vertical-align: -3px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: pulse 2s ease-in-out infinite;
  }
  .dot.offline { background: var(--magenta); box-shadow: 0 0 8px var(--magenta); }
  @keyframes pulse { 50% { opacity: 0.4; } }

  #reloj { color: var(--text); }

  main { padding: 28px; max-width: 1200px; margin: 0 auto; }

  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--cyan);
    padding: 16px 18px;
  }
  .kpi.alert { border-left-color: var(--magenta); }
  .kpi.warn { border-left-color: var(--amber); }
  .kpi-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .kpi-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
  }
  .kpi.alert .kpi-value { color: var(--magenta); }
  .kpi.warn .kpi-value { color: var(--amber); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    margin-bottom: 22px;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--panel-border);
    background: #0d131b;
  }
  .panel-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--cyan);
    text-transform: uppercase;
  }
  .panel-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    padding: 10px 16px;
    font-weight: 600;
    border-bottom: 1px solid var(--panel-border);
  }
  td {
    padding: 10px 16px;
    font-size: 15px;
    border-bottom: 1px solid #161e29;
  }
  tr:last-child td { border-bottom: none; }
  .num { font-family: 'JetBrains Mono', monospace; text-align: right; }
  .tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 2px;
  }
  .tag.deuda { background: rgba(255, 61, 129, 0.12); color: var(--magenta); }
  .tag.bajo { background: rgba(255, 178, 56, 0.12); color: var(--amber); }
  .tag.ok { background: rgba(76, 224, 210, 0.1); color: var(--cyan); }
  .tag.pendiente { background: rgba(255, 178, 56, 0.12); color: var(--amber); }
  .tag.en_proceso { background: rgba(76, 224, 210, 0.1); color: var(--cyan); }
  .tag.listo { background: rgba(129, 140, 248, 0.14); color: #a5b4fc; }
  .tag.entregado { background: rgba(61, 220, 132, 0.12); color: #3ddc84; }
  .tag.cancelado { background: rgba(255, 61, 129, 0.12); color: var(--magenta); }
  .tag.aprobado { background: rgba(61, 220, 132, 0.12); color: #3ddc84; }
  .tag.rechazado { background: rgba(255, 61, 129, 0.12); color: var(--magenta); }
  .tag.sin_comprobante { background: rgba(91, 107, 116, 0.14); color: #91a2ab; }
  .tag.monto_inconsistente { background: rgba(255, 61, 129, 0.12); color: #ff9fbd; }
  .diagnostico { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; padding:14px 16px; }
  .diag-item { border:1px solid var(--panel-border); padding:10px 12px; background:#0b1118; }
  .diag-label { color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:1px; }
  .diag-value { margin-top:4px; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--cyan); }
  .diag-value.warn { color:var(--amber); }
  .diag-value.error { color:var(--magenta); }

  .panel > div[id^="tabla-"] { overflow-x: auto; }
  .panel table { min-width: 680px; }

  .empty {
    padding: 24px 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }

  .acciones { display: flex; gap: 6px; justify-content: flex-end; }
  .btn-icon {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    width: 30px; height: 30px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-icon:hover { border-color: var(--cyan); color: var(--cyan); }
  .btn-icon.check:hover { border-color: #3ddc84; color: #3ddc84; }
  .btn-icon.delete:hover { border-color: var(--magenta); color: var(--magenta); }

  /* --- MODALES --- */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(5, 7, 10, 0.75);
    backdrop-filter: blur(2px);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.abierto { display: flex; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--cyan);
    box-shadow: 0 0 24px rgba(76, 224, 210, 0.15);
    width: 90%;
    max-width: 420px;
    padding: 0;
  }
  .modal-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--panel-border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-head h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--cyan);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .modal-close { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; }
  .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 5px;
  }
  .field input, .field select {
    width: 100%;
    background: #0a0e14;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    border-radius: 2px;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--cyan); }
  .modal-foot {
    padding: 14px 18px;
    border-top: 1px solid var(--panel-border);
    display: flex; justify-content: flex-end; gap: 10px;
  }
  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    padding: 9px 16px;
    border-radius: 2px;
    cursor: pointer;
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--text-dim);
  }
  .btn.primary { border-color: var(--cyan); color: var(--cyan); }
  .btn.primary:hover { background: rgba(76, 224, 210, 0.1); }
  .btn.danger { border-color: var(--magenta); color: var(--magenta); }
  .btn.danger:hover { background: rgba(255, 61, 129, 0.1); }
  .btn:hover { color: var(--text); }

  .toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    max-width: min(420px, calc(100vw - 40px));
    padding: 12px 16px;
    border: 1px solid var(--cyan);
    background: #0d131b;
    color: var(--text);
    box-shadow: 0 0 24px rgba(76, 224, 210, 0.15);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    z-index: 400;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.visible { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: var(--magenta); color: #ff9fbd; }

  @media (max-width: 640px) {
    main { padding: 16px; }
    header { padding: 14px 16px; flex-direction: column; gap: 8px; align-items: flex-start; }
    td, th { padding: 8px 10px; font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">REBECCA_CORE<span class="cursor"></span></div>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="conexion">conectando...</span>
    <span id="reloj"></span>
  </div>
</header>

<main>
  <div class="kpis" id="kpis"></div>

  <div class="panel">
    <div class="panel-head"><span class="panel-title">Estado del sistema</span><span class="panel-count">diagnóstico en vivo</span></div>
    <div class="diagnostico" id="diagnostico"></div>
  </div>

  <div class="panel">
    <div class="panel-head"><span class="panel-title">Atención y alertas</span><span class="panel-count" id="count-alertas"></span></div>
    <div id="tabla-alertas"></div>
    <div id="tabla-atencion-humana" style="margin-top:12px"></div>
  </div>

  <div class="panel">
    <div class="panel-head"><span class="panel-title">Presupuestos por confirmar</span><span class="panel-count" id="count-presupuestos"></span></div>
    <div id="tabla-presupuestos"></div>
  </div>

  <!-- PANEL PEDIDOS -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">Trabajos pendientes</span>
      <span class="panel-count" id="count-pedidos"></span>
    </div>
    <div id="tabla-pedidos"></div>
  </div>

  <!-- PANEL DEUDORES -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">Deudores</span>
      <span class="panel-count" id="count-deudores"></span>
    </div>
    <div id="tabla-deudores"></div>
  </div>

  <!-- PANEL RUTINAS (NUEVO) -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">Rutinas Semanales</span>
      <span class="panel-count" id="count-rutinas"></span>
    </div>
    <div id="tabla-rutinas"></div>
  </div>

  <!-- PANEL RECORDATORIOS ÚNICOS -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">Recordatorios Programados</span>
      <span class="panel-count" id="count-recordatorios"></span>
    </div>
    <div id="tabla-recordatorios"></div>
  </div>

  <!-- PANEL INSUMOS -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">Stock de insumos</span>
      <div>
        <span class="panel-count" id="count-insumos" style="margin-right: 10px;"></span>
        <button class="btn primary" style="padding: 4px 8px; font-size: 10px;" onclick="abrirModalInsumo()">+ NUEVO</button>
      </div>

  <!-- PANEL PRECIOS -->

    <div class="panel-head">
      <span class="panel-title">Lista de precios</span>
      <span class="panel-count" id="count-precios"></span>
    </div>
    <div id="tabla-precios"></div>
  </div>
</main>

<!-- MODAL EDICIÓN PEDIDOS / DEUDORES -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">

      <h3 id="modal-titulo">Editar pedido</h3>
      <button class="modal-close" onclick="cerrarModal()">✕</button>

    <div class="modal-body">
      <div class="field">

          <option value="pendiente">Pendiente</option>

          <option value="diseno_pendiente">Preparando diseño</option>
          <option value="en_proceso">En proceso</option>
          <option value="listo">Listo para entregar</option>
          <option value="entregado">Entregado</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
      <div class="field"><label>Qué falta</label><input type="text" id="edit-tareas"></div>
      <div class="field"><label>Fecha de entrega</label><input type="date" id="edit-fecha"></div>
      <div class="field"><label>Precio total</label><input type="number" min="0" step="0.01" id="edit-precio"></div>
      <div class="field"><label>Seña pagada</label><input type="number" min="0" step="0.01" id="edit-sena"></div>
      <div class="field"><label>Estado del diseño</label><select id="edit-diseno"><option value="pendiente">Pendiente</option><option value="enviado">Enviado al cliente</option><option value="cambios_solicitados">Cambios solicitados</option><option value="aprobado">Aprobado</option><option value="no_requiere">No requiere</option></select></div>
      <div class="field"><label>Entrega</label><select id="edit-modalidad"><option value="a_confirmar">A confirmar</option><option value="retiro">Retiro por el local</option><option value="envio">Envío</option></select></div>
      <div class="field"><label>Dirección</label><input type="text" id="edit-direccion"></div>
      <div class="field"><label>Turno / franja de entrega</label><input type="text" id="edit-turno" placeholder="Ej: viernes de 15 a 18"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="cerrarModal()">Cancelar</button>
      <button class="btn primary" onclick="guardarPedido()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL EDICIÓN PRODUCTO -->
<div class="modal-overlay" id="modal-producto">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-prod-titulo">Editar producto</h3>
      <button class="modal-close" onclick="cerrarModalProducto()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Precio de venta</label><input type="number" id="edit-prod-precio"></div>
      <div class="field"><label>Costo</label><input type="number" id="edit-prod-costo"></div>

</div>

<!-- MODAL EDICIÓN RUTINA (NUEVO) -->
<div class="modal-overlay" id="modal-rutina">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-rut-titulo">Editar Rutina</h3>
      <button class="modal-close" onclick="cerrarModalRutina()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Día de la semana</label>
        <select id="edit-rut-dia">

          <option value="3">Jueves</option><option value="4">Viernes</option><option value="5">Sábado</option><option value="6">Domingo</option>

      <div class="field"><label>Mensaje / Acción</label><input type="text" id="edit-rut-mensaje"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="cerrarModalRutina()">Cancelar</button>
      <button class="btn primary" onclick="guardarRutina()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL EDICIÓN INSUMO -->
<div class="modal-overlay" id="modal-insumo">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-ins-titulo">Agregar/Editar Insumo</h3>
      <button class="modal-close" onclick="cerrarModalInsumo()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Nombre del insumo</label><input type="text" id="edit-ins-nombre"></div>
      <div class="field"><label>Cantidad actual</label><input type="number" step="0.1" id="edit-ins-cantidad"></div>
      <div class="field"><label>Unidad (ej: unidades, litros, metros)</label><input type="text" id="edit-ins-unidad" value="unidades"></div>
      <div class="field"><label>Alerta Mínima</label><input type="number" step="0.1" id="edit-ins-alerta"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="cerrarModalInsumo()">Cancelar</button>
      <button class="btn primary" onclick="guardarInsumo()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const API_BASE = window.location.protocol === "file:" ? "http://127.0.0.1:8000" : window.location.origin;
const DASHBOARD_TOKEN = new URLSearchParams(window.location.search).get("token") || "";
let pedidosCache = [];
let deudoresCache = [];
let productosCache = [];
let rutinasCache = [];
let alertasCache = [];
let atencionesCache = [];
let insumosCache = [];
let recordatoriosCache = [];
const diasStr = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];

function fmtMoney(n) { return "$" + Number(n || 0).toLocaleString("es-AR", { maximumFractionDigits: 0 }); }
function tablaVacia(msg) { return `<div class="empty">${msg}</div>`; }
function etiquetaEstado(estado) {
  const clave = ["pendiente", "esperando_sena", "diseno_pendiente", "en_proceso", "listo", "entregado", "cancelado"].includes(estado) ? estado : "pendiente";
  const texto = { pendiente: "Pendiente", esperando_sena: "Esperando seña", diseno_pendiente: "Preparando diseño", en_proceso: "En proceso", listo: "Listo para entregar", entregado: "Entregado", cancelado: "Cancelado" }[clave];
  return `<span class="tag ${clave}">${texto}</span>`;
}
function escapeHTML(valor) {
  return String(valor ?? "").replace(/[&<>'"]/g, caracter => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
  })[caracter]);
}

let toastTimer;
function mostrarAviso(mensaje, esError = false) {
  const toast = document.getElementById("toast");
  toast.textContent = mensaje;
  toast.classList.toggle("error", esError);
  toast.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("visible"), 3500);
}

async function apiFetch(ruta, opciones = {}) {
  const headers = { ...(opciones.headers || {}) };
  if (DASHBOARD_TOKEN) headers["X-Dashboard-Token"] = DASHBOARD_TOKEN;
  const respuesta = await fetch(API_BASE + ruta, { ...opciones, headers });
  let data = {};
  try { data = await respuesta.json(); } catch (_) {}
  if (!respuesta.ok || data.status === "error") {
    throw new Error(data.detail || data.message || `Error ${respuesta.status}`);
  }
  return data;
}

function renderDiagnostico(d) {
  const items = [
    ["Rebecca Core", d.core, d.core === "activo" ? "" : "error"],
    ["Correo", d.correo, d.correo === "configurado" ? "" : "error"],
    ["WhatsApp", d.whatsapp, d.whatsapp === "conectado" ? "" : "error"],
    ["URL pública", d.url_estable === "si" ? "estable" : "temporal (ngrok)", d.url_estable === "si" ? "" : "warn"],
    ["Pagos por revisar", d.comprobantes_pendientes, d.comprobantes_pendientes ? "warn" : ""],
    ["Envíos con error", d.envios_fallidos, d.envios_fallidos ? "error" : ""]
  ];
  document.getElementById("diagnostico").innerHTML = items.map(([label, value, clase]) =>
    `<div class="diag-item"><div class="diag-label">${escapeHTML(label)}</div><div class="diag-value ${clase}">${escapeHTML(value)}</div></div>`
  ).join("");
}

function etiquetaPago(p) {
  const estado = p.comprobante_pago_estado || "sin_comprobante";
  const texto = {
    sin_comprobante: "Sin archivo", pendiente: "Por revisar", aprobado: "Aprobado",
    rechazado: "Rechazado", monto_inconsistente: "Revisar monto"
  }[estado] || estado;
  return `<span class="tag ${estado}" title="${escapeHTML(p.comprobante_pago_observaciones || p.comprobante_pago_recibido || '')}">${escapeHTML(texto)}</span>`;
}

function enviarDiseno(id) {
  const selector = document.createElement("input");
  selector.type = "file";
  selector.accept = "image/jpeg,image/png,image/webp,application/pdf";
  selector.onchange = async () => {
    const archivo = selector.files?.[0];
    if (!archivo) return;
    if (archivo.size > 12 * 1024 * 1024) return mostrarAviso("El diseño supera 12 MB.", true);
    const mensaje = prompt("Mensaje para acompañar la muestra:", `Muestra de diseño del pedido #${id}. Respondé APROBAR o indicá los cambios que necesitás.`);
    if (mensaje === null) return;
    try {
      const contenido = await new Promise((resolve, reject) => { const lector = new FileReader(); lector.onload = () => resolve(lector.result); lector.onerror = reject; lector.readAsDataURL(archivo); });
      const data = await apiFetch("/dashboard/enviar_diseno", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({pedido_id:id,nombre:archivo.name,mime:archivo.type,contenido_base64:contenido,mensaje})});
      mostrarAviso(data.message); await cargarDatos();
    } catch (error) { mostrarAviso(error.message || "No se pudo enviar el diseño.", true); }
  };
  selector.click();
}

    });
    mostrarAviso(data.message); await cargarDatos();
  } catch (error) { mostrarAviso(error.message, true); }
}

async function cargarDatos() {
  try {
    const data = await apiFetch("/dashboard/data");
    renderKPIs(data.resumen);
    renderDiagnostico(data.diagnostico);
    renderAtencion(data.alertas, data.atenciones_humanas);
    renderPresupuestos(data.presupuestos);
    renderPedidos(data.pedidos);
    renderDeudores(data.deudores);
    renderRecordatorios(data.recordatorios);
    renderRutinas(data.rutinas);
    renderInsumos(data.insumos);
    renderPrecios(data.productos);
    document.getElementById("dot").classList.remove("offline");
    document.getElementById("conexion").textContent = "conectado";
  } catch (e) {
    document.getElementById("dot").classList.add("offline");
    document.getElementById("conexion").textContent = "sin conexión al servidor";
    console.error(e);
  }
}

function actualizarReloj() { document.getElementById("reloj").textContent = new Date().toLocaleTimeString("es-AR"); }
cargarDatos(); actualizarReloj();
setInterval(cargarDatos, 30000); setInterval(actualizarReloj, 1000);
</script>
</body>
